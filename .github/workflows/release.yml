name: Release Builds

on:
  workflow_dispatch:
    inputs:
      draft:
        description: "Create GitHub release as draft"
        required: false
        default: true
        type: boolean
      prerelease:
        description: "Mark GitHub release as prerelease"
        required: false
        default: false
        type: boolean

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Sync npm version
        run: npm install --global npm@12.2.0

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npx biome check --reporter summary

      - name: Run build:sources
        run: npm run build:sources

      - name: Run Unit tests
        run: npm run test:unit

  tag-release:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Get version
        id: get_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git tag -a v${{ steps.get_version.outputs.version }} -m "Release v${{ steps.get_version.outputs.version }}"
          git push origin v${{ steps.get_version.outputs.version }}

  create-release:
    needs: tag-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.tag-release.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Sync npm version
        run: npm install --global npm@12.2.0

      - name: Install dependencies
        run: npm ci

      - name: Extract release notes for version
        id: release_notes
        shell: bash
        run: |
          if [[ "${VERSION}" == *-* ]]; then
            CHANGELOG_ARGS=(--stdout --latest-version "${VERSION}" --starting-version "${VERSION}" --hide-credit --template ./auto-changelog-release.hbs)
          else
            CHANGELOG_ARGS=(--stdout --starting-version "${VERSION}" --ending-version "${VERSION}" --hide-credit --template ./auto-changelog-release.hbs)
          fi
          NOTES=$(npm run --silent changelog -- "${CHANGELOG_ARGS[@]}")
          {
            echo "notes<<EOF"
            echo "${NOTES}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NOTES: ${{ steps.release_notes.outputs.notes }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail

          notes_file="$RUNNER_TEMP/release-notes.md"
          printf '%s\n' "$RELEASE_NOTES" > "$notes_file"

          args=(--title "v${VERSION}" --notes-file "$notes_file" --draft)

          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi

          gh release create "v${VERSION}" "${args[@]}"

  build-windows-helper:
    needs:
      - tag-release
      - create-release
    strategy:
      matrix:
        include:
          - runner: windows-2025
            arch: x64
            build-script: build:native:git-askpass:x64
          - runner: windows-11-arm
            arch: arm64
            build-script: build:native:git-askpass:arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Sync npm version
        run: npm install --global npm@12.2.0

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64

      - name: Install dependencies
        run: npm ci

      - name: Build native helper
        run: npm run ${{ matrix.build-script }}

      - name: Test native helper
        run: npm run test:native:git-askpass -- ${{ matrix.arch }}

      - name: Upload helper
        uses: actions/upload-artifact@v7
        with:
          name: windows-git-askpass-${{ matrix.arch }}
          path: native/git-credentials-helper/windows-askpass/out/win32-${{ matrix.arch }}/eldritch-launcher-git-askpass.exe
          if-no-files-found: error

  build-and-publish:
    needs:
      - create-release
      - build-windows-helper
    permissions:
      contents: write
    strategy:
      max-parallel: 1
      matrix:
        include:
          - os: windows-latest
            platformArgs: --win
          - os: macos-latest
            platformArgs: --mac
          - os: ubuntu-latest
            platformArgs: --linux
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Builds are unsigned: never pick up a signing identity from the runner.
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch tags
        run: git fetch --tags --force

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Sync npm version
        run: npm install --global npm@12.2.0

      - name: Install dependencies
        run: npm ci

      - name: Download x64 Git helper
        if: ${{ runner.os == 'Windows' }}
        uses: actions/download-artifact@v8
        with:
          name: windows-git-askpass-x64
          path: native/git-credentials-helper/windows-askpass/out/win32-x64

      - name: Download ARM64 Git helper
        if: ${{ runner.os == 'Windows' }}
        uses: actions/download-artifact@v8
        with:
          name: windows-git-askpass-arm64
          path: native/git-credentials-helper/windows-askpass/out/win32-arm64

      - name: Build sources
        run: npm run build:sources

      - name: Build and publish ${{ matrix.os }} artifacts
        run: npx electron-builder --config electron-builder-config.ts ${{ matrix.platformArgs }} --publish onTagOrDraft

  finalize-release:
    needs:
      - tag-release
      - create-release
      - build-and-publish
    if: ${{ success() && inputs.draft == false }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.tag-release.outputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Publish release
        run: |
          TAG="v${VERSION}"
          gh release edit "$TAG" --draft=false --prerelease=${{ inputs.prerelease }}

  cleanup-tag:
    needs:
      - tag-release
      - create-release
      - build-and-publish
    if: ${{ failure() && needs.tag-release.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.tag-release.outputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Delete tag and release on failure
        run: |
          TAG="v${VERSION}"
          echo "Deleting tag $TAG due to workflow failure."
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git push origin ":refs/tags/$TAG" || true

          if command -v gh >/dev/null 2>&1; then
            release_id=$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate --jq ".[] | select(.tag_name == \"$TAG\") | .id" 2>/dev/null | head -n 1 || true)
            if [ -n "$release_id" ]; then
              echo "Deleting GitHub release $TAG (id: $release_id)"
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/$release_id" || true
            else
              echo "No release found for $TAG; skipping release delete."
            fi
          else
            echo "gh CLI not available; skipping release deletion."
          fi
